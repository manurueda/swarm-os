# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Agent Runtime Port
purpose: "Defines the AgentRuntime port and normalized domain vocabulary for
  Swarm OS (types.ts: ModuleSpec, SwarmRecord, MissionRecord, AgentSpec,
  SwarmEvent, AgentRuntime), and implements the sole runtime adapter today —
  ClaudeCodeLocalRuntime, a subprocess wrapper around the local `claude` CLI's
  `--output-format stream-json` NDJSON protocol, translated into a normalized
  SwarmEvent stream. Also owns environment scrubbing to protect subscription
  billing, tool-less \"system tier\" prompt construction, empirically-anchored
  per-agent context-window baseline estimates, and self-update
  detection/check/apply for the Swarm OS binary itself. index.ts is the single
  flat barrel re-exporting the entire @swarm-os/core package (not just this
  module) — its own contribution is lines 1-42."
owns:
  - packages/core/src/runtime/**
  - packages/core/src/update/**
  - packages/core/src/index.ts
  - packages/core/src/types.ts
  - packages/core/package.json
  - packages/core/tsconfig.json
entryPoints:
  - packages/core/src/types.ts
  - packages/core/src/runtime/claude-code-local.ts
  - packages/core/src/runtime/stream-json.ts
  - packages/core/src/runtime/env.ts
  - packages/core/src/update/index.ts
  - packages/core/src/index.ts
dependsOn:
  - cli — consumes AgentRuntime, backgroundUpdate/readUpdateStatus etc. for the
    `swarm update` command and to spawn agents
  - mission — builds AgentSpec and drives it through
    AgentRuntime.run()/collectAgent for mission/reviewer agents
  - swarm-orchestration — Scheduler and analyst/manager code use AgentRuntime,
    standaloneSystemPrompt/standaloneAgentPrompt, and agentBaselineTokens to
    budget and run agents
  - mapper — partitioner/synthesiser agents use the system-tier prompt helpers
    and AgentRuntime
  - workspace-git — Workspace persists SwarmRecord/MissionRecord/ModuleSpec
    types defined here; update/index.ts's stateDir() (~/.swarm) is distinct from
    the per-project workspace .swarm/ dir owned by workspace-git
fileCount: 13
