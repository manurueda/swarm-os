# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Architecture Analysis
purpose: "Pure, model-free static analysis of a target repository (file/line
  facts, a regex-derived import graph, and severity-ranked structural 'Signal's
  + per-module health), plus one model-backed step (refactor.ts) that spawns a
  read-only reviewer agent per module to confirm/reject those signals and emit
  structured, actionable refactor proposals rendered as a Markdown report. Four
  files total, each building on the last: code-stats.ts ->
  import-graph.ts/signals.ts -> refactor.ts."
owns:
  - packages/core/src/architecture/**
entryPoints:
  - packages/core/src/architecture/signals.ts
  - packages/core/src/architecture/code-stats.ts
  - packages/core/src/architecture/import-graph.ts
  - packages/core/src/architecture/refactor.ts
dependsOn:
  - swarm-orchestration
  - runtime
fileCount: 6
