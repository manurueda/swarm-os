# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Swarm Orchestration
purpose: Owns the swarm agent lifecycle (wake with a scoped context pack, sleep
  with memory compression), per-module ownership enforcement, the "areas"
  sub-splitting mechanism for large modules' memory, the analyst agent that
  produces a module's charter+memory, the adversarial memory verifier, a
  rate-limit-aware concurrency scheduler for spawning agent processes, and
  `runLoop` — the unattended survey→pick→mission→verify→merge cycle that drives
  `swarm loop` on a single integration branch.
owns:
  - packages/core/src/swarm/**
  - packages/core/src/loop/**
entryPoints:
  - packages/core/src/swarm/manager.ts
  - packages/core/src/swarm/analyst.ts
  - packages/core/src/swarm/verify.ts
  - packages/core/src/swarm/areas.ts
  - packages/core/src/swarm/ownership.ts
  - packages/core/src/swarm/scheduler.ts
  - packages/core/src/loop/run.ts
dependsOn:
  - mission
  - workspace-git
  - runtime
  - architecture-analysis
fileCount: 27
