# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Swarm Orchestration
purpose: "Manages the agent swarm lifecycle and the multi-module missions built
  on it: enforces per-module file ownership (glob matching + post-hoc diff
  checking), splits large modules into 'areas' for finer-grained memory, runs
  the per-module 'analyst' agent that produces a module's charter and memory,
  verifies memory claims deterministically and adversarially, schedules
  concurrent agent processes under a subscription rate-limit budget, and drives
  `swarm loop` — an unattended, hours-long cycle of survey → pick task → run
  mission → verify → merge onto a single integration branch."
owns:
  - packages/core/src/swarm/**
  - packages/core/src/loop/**
entryPoints:
  - packages/core/src/swarm/manager.ts
  - packages/core/src/swarm/analyst.ts
  - packages/core/src/swarm/verify.ts
  - packages/core/src/swarm/ownership.ts
  - packages/core/src/swarm/areas.ts
  - packages/core/src/swarm/scheduler.ts
  - packages/core/src/loop/run.ts
dependsOn:
  - runtime
  - workspace-git
  - mission
  - architecture-analysis
  - mapper
fileCount: 7
