# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Repo Mapper
purpose: Turns a target repository into a durable, on-disk module map without
  ever sending source code to a model. digest.ts computes a deterministic,
  git-derived structural fingerprint of the repo (file list, per-file content
  hashes, directory tree, doc headings, manifest excerpts) at zero token cost.
  map.ts sends only that digest to one tool-less agent to propose module
  boundaries (slug/name/purpose/owns-globs/entryPoints/dependsOn) and renders
  system.md / module.md prose. pipeline.ts (mapProject) orchestrates the full
  incremental digest->partition->analyse->survey-areas->synthesise run, composed
  of ~20 single-purpose step files under pipeline/ that each take explicit
  arguments instead of closing over mapProject's locals (so a step defined but
  never wired in shows up as an unimported file, not dead code hidden in a
  closure). pipeline.ts also exposes detectDrift (has the repo moved since the
  last map, per-module) and pendingSplits (large modules whose structural
  sub-domains were never surveyed into per-area memory).
owns:
  - packages/core/src/mapper/**
entryPoints:
  - packages/core/src/mapper/pipeline.ts
  - packages/core/src/mapper/digest.ts
  - packages/core/src/mapper/map.ts
  - packages/core/src/mapper/pipeline/types.ts
  - packages/core/src/mapper/pipeline/module-files.ts
dependsOn:
  - runtime
  - swarm-orchestration
  - workspace-git
fileCount: 41
