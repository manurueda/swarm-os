# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Mission Orchestration
purpose: "Executes a single Swarm OS 'mission': turn one natural-language goal
  into module assignments (route.ts), spawn one isolated worker agent per
  assigned module in its own git worktree with only that module's context
  (run.ts), have an independent read-only reviewer agent critique the resulting
  diff before commit (review.ts), then commit, compress the module's memory
  ('sleep'), and clean up worktrees. run.ts is the single orchestrator tying all
  of this together end-to-end."
owns:
  - packages/core/src/mission/**
entryPoints:
  - packages/core/src/mission/run.ts
  - packages/core/src/mission/route.ts
  - packages/core/src/mission/review.ts
  - packages/core/src/mission/mission-id.test.ts
dependsOn:
  - swarm-orchestration
  - workspace-git
  - runtime
  - mapper
fileCount: 4
