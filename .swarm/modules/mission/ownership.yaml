# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Mission Orchestration
purpose: "Executes a single Swarm OS mission end-to-end: routes a
  natural-language goal to the fewest module(s) that must change (route.ts),
  spawns one isolated worker agent per assigned module in its own git worktree
  with only that module's charter/memory/context pack (run.ts:runMission), has a
  read-only reviewer agent critique each module's diff before commit
  (review.ts), then commits per-module branches, triggers memory compression
  ('sleep') for every touched swarm, and cleans up worktrees whose work was
  safely committed. run.ts is the sole orchestrator; route.ts and review.ts are
  agent-spawning helpers it calls."
owns:
  - packages/core/src/mission/**
entryPoints:
  - packages/core/src/mission/run.ts
  - packages/core/src/mission/route.ts
  - packages/core/src/mission/review.ts
  - packages/core/src/mission/mission-id.test.ts
dependsOn:
  - runtime
  - swarm-orchestration
  - workspace-git
  - mapper
fileCount: 4
