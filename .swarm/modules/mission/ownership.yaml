# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Mission Orchestration
purpose: "Defines and executes a Swarm OS 'mission': routing a single
  natural-language goal to the module(s) it touches (route.ts), spawning one
  isolated worker agent per assigned module in its own git worktree with only
  that module's charter/memory (run.ts), and having an independent reviewer
  agent critique each resulting diff before it is committed (review.ts). run.ts
  is the orchestrator that ties routing, worktree creation, agent execution,
  review, commit, memory-compression ('sleep'), and worktree cleanup into one
  end-to-end mission lifecycle."
owns:
  - packages/core/src/mission/**
entryPoints:
  - packages/core/src/mission/run.ts
  - packages/core/src/mission/route.ts
  - packages/core/src/mission/review.ts
dependsOn:
  - runtime
  - swarm-orchestration
  - workspace-git
  - mapper
fileCount: 3
