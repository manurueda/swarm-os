# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: CLI & Product Surface
purpose: The user-facing `swarm` CLI (@swarm-os/cli) plus the repo root
  docs/manifests. Parses argv (args.ts), resolves a
  Workspace/AgentRuntime/SwarmConfig context (context.ts), and dispatches to one
  handler per subcommand under commands/ (doctor, map, status, mission/missions,
  memory, verify, refactor, ui, sleep, wake, loop, update). Owns terminal
  rendering (ui.ts, including a live in-place multi-row status board), a
  localhost-only HTTP server for `swarm ui --serve` (server.ts), and self-update
  scheduling wrapped around every invocation (commands/update.ts). Contains zero
  domain logic itself — mapping, mission orchestration, workspace/git,
  verification, refactor-signal analysis and the runtime port are all imported
  from @swarm-os/core.
owns:
  - packages/cli/**
  - README.md
  - docs/**
  - package.json
  - package-lock.json
  - tsconfig.base.json
  - LICENSE
  - .gitignore
entryPoints:
  - packages/cli/src/main.ts
  - packages/cli/src/args.ts
  - packages/cli/src/context.ts
  - packages/cli/src/ui.ts
  - packages/cli/src/server.ts
  - packages/cli/src/commands/update.ts
dependsOn:
  - runtime
  - mission
  - mapper
  - swarm-orchestration
  - workspace-git
  - architecture-analysis
  - ui-observability
fileCount: 27
