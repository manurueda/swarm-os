# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: CLI & Product Surface
purpose: "The user-facing CLI (`@swarm-os/cli`, bin `swarm`) plus the repo's
  root docs/manifests. It parses argv, resolves a
  Workspace/AgentRuntime/SwarmConfig context, and dispatches to one handler per
  subcommand (map, status, mission, missions, memory, verify, refactor, ui,
  sleep, wake, loop, update). It owns zero domain logic — mapping, mission
  routing/orchestration, workspace/git, and the runtime port are all imported
  wholesale from `@swarm-os/core` — and contributes only: argv parsing
  (args.ts), context resolution (context.ts), terminal rendering including a
  live in-place multi-row status board (ui.ts), a localhost-only HTTP server for
  `swarm ui --serve` (server.ts), and self-update scheduling around every
  command invocation (commands/update.ts)."
owns:
  - packages/cli/**
  - README.md
  - docs/**
  - package.json
  - package-lock.json
  - tsconfig.base.json
  - LICENSE
  - .gitignore
entryPoints:
  - packages/cli/src/main.ts
  - packages/cli/src/context.ts
  - packages/cli/src/args.ts
  - packages/cli/src/ui.ts
  - packages/cli/src/server.ts
dependsOn:
  - runtime
  - workspace-git
  - mission
  - mapper
  - swarm-orchestration
  - ui-observability
  - architecture-analysis
fileCount: 26
