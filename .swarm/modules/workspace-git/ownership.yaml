# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Workspace & Git Worktrees
purpose: "Two tightly-scoped pieces read together: (1) workspace/store.ts +
  config.ts define the on-disk schema and typed read/write API for a target
  repo's `.swarm/` directory (config, module map/ownership, per-module
  memory/decisions/areas, swarm state.json, mission records + append-only event
  logs); (2) git/worktree.ts is a thin execFile wrapper around the `git` CLI
  plus a worktree lifecycle (create/reuse/remove/prune), dependency-symlinking
  so worktrees are buildable, and the diff/commit primitives (changedFiles,
  diffStat, fullDiff, commitAll) that always hide both linked dependency
  symlinks and `.swarm/` itself from what a mission can see or commit."
owns:
  - packages/core/src/workspace/**
  - packages/core/src/git/**
entryPoints:
  - packages/core/src/workspace/store.ts
  - packages/core/src/workspace/config.ts
  - packages/core/src/git/worktree.ts
dependsOn:
  - runtime
fileCount: 6
