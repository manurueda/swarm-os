# Paths this module owns. Agents are scoped to these globs and their
# diffs are checked against them after every mission.

name: Workspace & Git Worktrees
purpose: Durable on-disk store (`workspace/`) for everything Swarm OS knows
  about a target repo under its `.swarm/` directory (config, module
  map/ownership, per-module memory/decisions/areas, swarm state, mission
  records/event logs), plus a git CLI wrapper and worktree lifecycle manager
  (`git/`) that gives each agent an isolated checkout under `.swarm/worktrees/`
  so parallel swarms never collide on the index or working tree, and provides
  the primitives (diff, commit, clean-tree check) that missions and the
  unattended loop are built on.
owns:
  - packages/core/src/workspace/**
  - packages/core/src/git/**
entryPoints:
  - packages/core/src/workspace/store.ts
  - packages/core/src/workspace/config.ts
  - packages/core/src/git/worktree.ts
dependsOn:
  - mission (run.ts drives Workspace + worktree.ts to orchestrate a mission
    end-to-end)
  - swarm-orchestration (manager.ts, finalize-sleep.ts, memory-state.ts,
    verify.ts consume Workspace heavily for module/state/memory)
  - mapper (pipeline/* uses Workspace extensively for module map read/write,
    areas, archiving)
  - ui-observability (snapshot.ts reads Workspace to build the dashboard
    snapshot)
fileCount: 6
